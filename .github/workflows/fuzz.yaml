# Differential fuzzing of token parsing (#96) and what it reaches (#97).
# tools/fuzz/gen.py mutates the RFC 7520 and oracle tokens and records
# jwcrypto's and PyJWT's verdicts; tools/fuzz/replay.R runs zujose on the
# same cases and fails on any disagreement that tools/fuzz/allow.tsv does
# not list; tools/fuzz/reach.R replays them under covr and fails under the
# floor in tools/fuzz/floor.txt. Development only, never run at check
# time. This workflow is bespoke: r-actions' fuzz.yml builds a libFuzzer
# harness over C, and zujose is pure R. It runs weekly and by hand only,
# never on pull requests or pushes, to spare Actions minutes.
on:
  workflow_dispatch:
    inputs:
      cases:
        description: Cases to generate
        default: "10000"
  schedule:
    - cron: "5 8 * * 3"  # weekly, Wednesdays

name: fuzz

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  fuzz:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      GITHUB_PAT: ${{ secrets.GITHUB_TOKEN }}
      CASES: ${{ inputs.cases || '10000' }}
      OUT: ${{ github.workspace }}/fuzz-out
    steps:
      - uses: actions/checkout@v4

      - uses: r-lib/actions/setup-r@v2
        with:
          use-public-rspm: true

      - uses: r-lib/actions/setup-r-dependencies@v2
        with:
          extra-packages: any::covr, any::pkgload

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      # The versions tests/testthat/fixtures/oracle/MANIFEST.tsv records;
      # change them together, and re-check tools/fuzz/allow.tsv.
      - name: Install the references
        run: |
          python -m pip install PyJWT==2.15.1 jwcrypto==1.5.6 \
            cryptography==50.0.2

      # The run number seeds the generator, so each run tries new cases
      # and any run can be repeated with the same seed.
      - name: Generate cases
        run: |
          python -I tools/fuzz/gen.py --seed "$GITHUB_RUN_NUMBER" \
            --cases "$CASES" --out "$OUT"

      - name: Compare verdicts
        run: Rscript tools/fuzz/replay.R --out "$OUT" "$OUT/cases.tsv"

      - name: Measure reach
        if: success() || failure()
        run: Rscript tools/fuzz/reach.R --out "$OUT" "$OUT/cases.tsv"

      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: fuzz-${{ github.run_number }}
          path: fuzz-out/
