# The JWE oracle (design section 10): zujose and Python's jwcrypto encrypt
# and decrypt each other's JWE tokens, for every alg/enc pair. JWE has no R
# oracle, so this development-only job stands in for one; it never runs at
# check time. r-actions has no such workflow, so this one is bespoke.
on:
  workflow_dispatch:
  pull_request:
    paths:
      - "R/jwe.R"
      - "R/aes.R"
      - "R/keys.R"
      - "tools/jwe-oracle/**"
      - ".github/workflows/jwe-oracle.yaml"

name: jwe-oracle

permissions: read-all

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.run_id }}
  cancel-in-progress: true

jobs:
  jwe-oracle:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      GITHUB_PAT: ${{ secrets.GITHUB_TOKEN }}
    steps:
      - uses: actions/checkout@v4

      - uses: r-lib/actions/setup-r@v2
        with:
          use-public-rspm: true

      - uses: r-lib/actions/setup-r-dependencies@v2
        with:
          extra-packages: any::pkgload
          needs: oracle

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install jwcrypto
        run: python -m pip install jwcrypto==1.5.6

      - name: Exchange JWE tokens
        run: |
          dir="$RUNNER_TEMP/jwe-oracle"
          mkdir -p "$dir"
          Rscript tools/jwe-oracle/oracle.R keys "$dir"
          Rscript tools/jwe-oracle/oracle.R encrypt "$dir"
          python tools/jwe-oracle/oracle.py "$dir"
          Rscript tools/jwe-oracle/oracle.R decrypt "$dir"
