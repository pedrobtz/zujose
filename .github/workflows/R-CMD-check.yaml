on:
  push:
    branches: [main, master]
  # `labeled` so that adding `full-ci` to a pull request reruns it in full.
  pull_request:
    types: [opened, synchronize, reopened, labeled]

name: R-CMD-check

permissions: read-all

# A new push to a pull request cancels the run it supersedes. Pushes to main
# get a group of their own, so every merge is checked and none is cancelled.
concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.run_id }}
  cancel-in-progress: true

jobs:
  R-CMD-check:
    uses: pedrobtz/r-actions/.github/workflows/r-cmd-check.yml@v1
    with:
      # Quick on each push to a pull request, full after merge. The
      # `full-ci` label runs the full set on a pull request before merging.
      profile: ${{ github.event_name == 'pull_request' && !contains(github.event.pull_request.labels.*.name, 'full-ci') && 'quick' || 'full' }}

      # The default matrix plus Windows R-devel: CRAN's
      # r-devel-windows-x86_64 flavor, the one win-builder exists to reach.
      # The containers cover R-devel on Linux; nothing else checks this
      # combination. It runs in the full profile only. The user agent is
      # "release" because under R-devel the default one can resolve to
      # binaries built for the wrong R.
      runners: >-
        [{"os": "macos-latest", "r": "release"},
         {"os": "windows-latest", "r": "release"},
         {"os": "windows-latest", "r": "devel", "http-user-agent": "release"},
         {"os": "ubuntu-latest", "r": "release"},
         {"os": "ubuntu-latest", "r": "oldrel-1"}]

      # CRAN's NOSUGGESTS flavor: only hard dependencies installed. Suggests
      # are jose and testthat; a test reaching for jose without
      # skip_if_not_installed() fails here and nowhere else.
      nosuggests: true

      # CRAN's NOLD flavor, R without long double. zujwt's arithmetic is on
      # NumericDate seconds as doubles; this checks it does not lean on
      # 80-bit intermediates. Both legs run in the full profile only.
      nold: true
